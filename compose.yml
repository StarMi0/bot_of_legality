version: '3'

services:
  db:
    image: mysql:latest
    restart: unless-stopped
    container_name: mysql-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: legality
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    networks:
      - mysql-database

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - mysql-database

  telegram-bot:
    build:
      context: ./bot  # Указываем каталог с ботом
    environment:
      # bot env data
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TOKEN_ADMIN: ${TOKEN_ADMIN}
      # DB env data
      MYSQL_DATABASE: legality
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./bot:/app  # Примонтировать папку bot внутрь контейнера
    restart: always
    command: python /app/main.py
    depends_on:
      - db
    ports:
      - "8081:8080"  # Проброс порта для доступа (если нужен)
    networks:
      - mysql-database


  redis:
    image: "redis:latest"
    container_name: "my-redis-container"
    depends_on:
      - db
    ports:
      - "6379:6379"
    networks:
      - my_network

secrets:
  git_ssh_key:
    file: .env

networks:
  mysql-database:
    driver: bridge
  my_network:
    driver: bridge