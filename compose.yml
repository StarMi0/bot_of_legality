services:

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    container_name: phpmyadmin
    environment:
      PMA_HOST: ${MYSQL_HOST}
      PMA_PORT: 3306
      PMA_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "8080:80"
    networks:
      - mysql-database

  telegram-bot:
    build:
      context: ./bot  # Указываем каталог с ботом
    environment:
      # bot env data
      BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      # DB env data
      MYSQL_DATABASE: legality
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_USER: ${MYSQL_USER}
      CONSULT_GROUP_ID: ${CONSULT_GROUP_ID}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./bot:/app  # Примонтировать папку bot внутрь контейнера
    restart: always
    command: python /app/main.py
    ports:
      - "8081:8080"  # Проброс порта для доступа (если нужен)
    networks:
      - mysql-database


  redis:
    image: "redis:latest"
    container_name: "my-redis-container"
    ports:
      - "6379:6379"
    networks:
      - mysql-database

networks:
  mysql-database:
    driver: bridge

